name: codeguardian

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: code-guardian-postgres
    environment:
      POSTGRES_DB: code_guardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/20260529/schema_20260529.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/20260529/init_permissions_20260529.sql:/docker-entrypoint-initdb.d/02_init_permissions.sql:ro
      - ./database/20260529/init_data_20260529.sql:/docker-entrypoint-initdb.d/03_init_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d code_guardian"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: code-guardian-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: code-guardian-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-ghcr.io/zyx-17/code-review-ai-agent:latest}
    container_name: code-guardian-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/code_guardian
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DATABASE: 1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-code-review}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GITCODE_TOKEN: ${GITCODE_TOKEN:-}
      API_TOKEN: ${API_TOKEN:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      DJL_CACHE_DIR: /tmp/djl-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-7003}:7003"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
