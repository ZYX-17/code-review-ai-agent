name: codeguardian

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: code-guardian-postgres
    environment:
      POSTGRES_DB: code_guardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/20260529/schema_20260529.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/20260529/init_permissions_20260529.sql:/docker-entrypoint-initdb.d/02_init_permissions.sql:ro
      - ./database/20260529/init_data_20260529.sql:/docker-entrypoint-initdb.d/03_init_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d code_guardian"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: code-guardian-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: code-guardian-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
