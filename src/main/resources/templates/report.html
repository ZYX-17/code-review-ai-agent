<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审查报告 - CodeGuardian AI</title>
    <style>
        html, body { height: 100%; margin: 0; background: #0d1117; }
        .report-frame { width: 100%; height: 100%; border: 0; display: block; }
        .report-toolbar {
            position: fixed; top: 10px; right: 16px; z-index: 10;
            display: flex; gap: 8px; background: rgba(13,17,23,.85);
            padding: 6px 10px; border-radius: 6px;
        }
        .report-toolbar a { color: #58a6ff; font-size: 13px; text-decoration: none; }
        .report-toolbar a:hover { text-decoration: underline; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="report-toolbar">
        <a th:href="@{'/api/report/' + ${taskId} + '/html'}" target="_blank"><i class="fas fa-code"></i> HTML</a>
        <a th:href="@{'/api/report/' + ${taskId} + '/markdown'}" target="_blank"><i class="fas fa-file-lines"></i> Markdown</a>
        <a th:href="@{'/api/report/' + ${taskId} + '/pdf'}"><i class="fas fa-file-pdf"></i> PDF</a>
    </div>
    <iframe class="report-frame" th:src="@{'/api/report/' + ${taskId} + '/html'}" title="审查报告"></iframe>
    <script>
        // 防止iframe加载失败时的回退
        (function(){
            var f = document.querySelector('.report-frame');
            f.addEventListener('error', function(){
                alert('报告加载失败，请稍后重试');
            });
        })();
    </script>
    
</body>
</html>
